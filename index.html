<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spécialement pour Needjah</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07080a;
            --lamp-white: #eeeeee;
            --lamp-yellow: #ffeb3b;
            --gold: #d4af37;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            transition: background 0.6s ease;
        }

        /* --- LAMPE --- */
        .lamp-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }

        .lamp-shade {
            width: 160px;
            height: 95px;
            background: var(--lamp-white);
            border-radius: 80px 80px 15px 15px;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .pull-cord {
            width: 3px;
            height: 150px;
            background: #444;
            position: relative;
            cursor: pointer;
            z-index: 1;
        }

        .pull-knob {
            width: 16px;
            height: 16px;
            background: var(--gold);
            border-radius: 50%;
            position: absolute;
            bottom: -8px;
            left: -6.5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- STATE: ON --- */
        body.is-on { background-color: #1a1c20; }
        
        body.is-on .lamp-shade {
            background: var(--lamp-yellow);
            box-shadow: 0 0 70px rgba(255, 235, 59, 0.5), inset 0 -10px 20px rgba(255,255,255,0.5);
        }

        .light-glow {
            position: absolute;
            top: 90px;
            width: 600px;
            height: 100vh;
            background: radial-gradient(circle at top, rgba(255, 235, 59, 0.15), transparent 75%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        body.is-on .light-glow { opacity: 1; }

        /* --- CARD --- */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            padding: 45px 35px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(100px);
            pointer-events: none;
            z-index: 10;
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            letter-spacing: 6px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        #timer {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }

        .message {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            line-height: 1.9;
            font-size: 1.15rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 35px;
        }

        .qr-section {
            display: inline-block;
            background: white;
            padding: 12px;
            border-radius: 20px;
        }
    </style>
</head>
<body id="body">

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/i1smpc.mp3" type="audio/mpeg">
    </audio>

    <div class="light-glow"></div>

    <div class="lamp-container">
        <div class="lamp-shade"></div>
        <div class="pull-cord" id="cord">
            <div class="pull-knob"></div>
        </div>
    </div>

    <div class="card" id="card">
        <h1>NEEDJAH</h1>
        <div id="timer">0j 0h 0m 0s</div>
        <p class="message">
            "Gen de moun ou te konnen depi lontan, men se koulye a ou reyalize valè yo tout bon. Mwen kontan nou te rekontre apre tout tan sa a, chak segonn n ap pale la a gen yon lòt gou. M vle nou pran tan nou pou n dekouvri kote bèl vibe sa a ap mennen nou... san presyon."
        </p>
        <div class="qr-section">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://loveqr.app" alt="QR Code">
        </div>
    </div>

    <script>
        const cord = document.getElementById('cord');
        const body = document.getElementById('body');
        const card = document.getElementById('card');
        const music = document.getElementById('bg-music');
        let isOn = false;

        // Dat kòmansman
        const startDate = new Date(2026, 2, 26, 0, 0, 0); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}j ${h}h ${m}m ${s}s`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Aksyon klike sou fil la
        cord.addEventListener('click', () => {
            isOn = !isOn;

            // Efè rale fil la ak GSAP
            gsap.to(cord, { duration: 0.15, height: 185, yoyo: true, repeat: 1, ease: "power1.inOut", onComplete: () => {
                if(isOn) {
                    body.classList.add('is-on');
                    card.classList.add('visible');
                    music.play().catch(e => console.log("Lekti bloke pa navigatè a"));
                } else {
                    body.classList.remove('is-on');
                    card.classList.remove('visible');
                    music.pause();
                }
            }});
        });
    </script>
</body>
</html>
